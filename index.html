
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I'm Really Sorry ❤️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      background: linear-gradient(135deg, #ffb6c1, #ffc0cb, #ffe4e1);
      font-family: "Arial", sans-serif;
      text-align: center;
      color: #a00045;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 15px;
      position: relative;
      z-index: 2;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      margin-bottom: 15px;
      animation: heartbeat 1.3s infinite;
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 25px;
    }

    button {
      border: none;
      border-radius: 30px;
      padding: 15px 28px;
      background: #ff2770;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 15px #e7548090;
      transition: transform 0.2s;
    }

    button:hover {
      transform: scale(1.08);
    }

    #sorryWall {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 25px 10px;
      position: relative;
      z-index: 1;
    }

    .sorry {
      font-weight: bold;
      color: #e6005c;
      animation: appear 0.45s ease-out both;
      text-shadow: 1px 2px 4px #ffffff80;
    }

    .heart {
      position: fixed;
      bottom: -40px;
      pointer-events: none;
      animation: floatUp linear forwards;
      z-index: 0;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: scale(0.2) rotate(-10deg);
      }
      to {
        opacity: 1;
        transform: scale(1) rotate(0);
      }
    }

    @keyframes floatUp {
      to {
        transform: translateY(-115vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <section class="hero">
    <h1>I'm So Sorry 🥺❤️</h1>

    <p>
      I know I messed up... 💔<br>
      Please forgive me? 🥹
    </p>

    <button onclick="floodSorry()">
      Tap for a Million Sorrys 💌
    </button>
  </section>

  <div id="sorryWall"></div>

  <script>
    const wall = document.getElementById("sorryWall");

    function floodSorry() {
      // Add 150 apologies each time the button is clicked
      for (let i = 0; i < 150; i++) {
        const message = document.createElement("span");
        message.className = "sorry";

        const messages = [
          "SORRY 🥺",
          "I'm Sorry ❤️",
          "Please Forgive Me 💗",
          "Really Sorry 😭",
          "My Bad 🫶",
          "SORRYYYY 💖"
        ];

        message.textContent =
          messages[Math.floor(Math.random() * messages.length)];

        message.style.fontSize =
          (14 + Math.random() * 22) + "px";

        message.style.animationDelay =
          (Math.random() * 0.5) + "s";

        wall.appendChild(message);
      }

      // Keep the page responsive after repeated clicks
      while (wall.children.length > 1500) {
        wall.removeChild(wall.firstChild);
      }
    }

    // Floating hearts
    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.textContent = ["❤️", "💗", "💕", "🥺"][ 
        Math.floor(Math.random() * 4)
      ];

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (15 + Math.random() * 25) + "px";
      heart.style.animationDuration = (4 + Math.random() * 4) + "s";

      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 8000);
    }

    setInterval(createHeart, 400);

    // Start with a little flood already on the page
    floodSorry();
  </script>
</body>
</html>
